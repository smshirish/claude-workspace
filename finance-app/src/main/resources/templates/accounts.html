<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Finance App — Accounts</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<header th:replace="~{fragments/nav :: nav('accounts')}"></header>

<main class="app-main">
<h1 class="page-title">Bank Accounts</h1>

<div th:if="${importError}" class="alert-banner alert-banner--error" data-testid="accounts-import-error">
    <p th:text="${importError}"></p>
</div>

<div th:if="${schemaError}" class="alert-banner alert-banner--error" data-testid="schema-error-banner">
  <p th:text="${schemaError}"></p>
</div>

<div th:if="${rowErrors}" class="alert-banner alert-banner--error" data-testid="row-errors-banner">
  <ul>
    <li th:each="err : ${rowErrors}"
        th:text="|Row ${err.rowNumber}, '${err.column}': ${err.message}|"
        th:attr="data-testid='row-error-' + ${err.rowNumber}">
    </li>
  </ul>
</div>

<form class="import-form" method="post" th:action="@{/accounts/import}" enctype="multipart/form-data" data-testid="accounts-import-form">
    <input type="file" name="file" accept=".csv" data-testid="accounts-file-input"/>
    <button type="submit" class="btn-import" data-testid="accounts-import-button">Import CSV</button>
</form>

<div th:if="${#lists.isEmpty(accounts)}" class="empty-state" data-testid="accounts-empty-state">
    <p>No accounts imported yet. Upload a CSV file to get started.</p>
</div>

<div th:unless="${#lists.isEmpty(accounts)}" class="accounts-table-wrapper">
<table class="accounts-table" data-testid="accounts-table">
    <thead>
    <tr>
        <th>Bank Name</th>
        <th>Account Number</th>
        <th>Account Type</th>
        <th>Balance</th>
        <th>Currency</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="account : ${accounts}" th:attr="data-testid='account-row-' + ${account.accountId()}">
        <td th:text="${account.bankName()}"></td>
        <td th:text="${account.accountNumber()}"></td>
        <td th:text="${account.accountType()}"></td>
        <td class="balance-cell" th:text="${account.balance()}"></td>
        <td th:text="${account.currency()}"></td>
    </tr>
    </tbody>
</table>
</div>
</main>

</body>
</html>

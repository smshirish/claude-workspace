<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance App — Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-SKqR7RiMJpWZDhiT/VDPG/U6Xjw39Rr0/wSLDBPLgcK7Jf2UPUmYcGGJ28QZPE" crossorigin="anonymous"></script>
</head>
<body>

<header class="app-header">
    <span class="app-title">Finance App</span>
    <nav class="app-nav">
        <span>Welcome, <strong th:text="${username}">user</strong></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Sign Out</button>
        </form>
    </nav>
</header>

<main class="app-main">
    <h2>Dashboard</h2>
    <p class="welcome-text">
        Welcome back, <strong th:text="${username}">user</strong>.
        More features are coming in the next phase.
    </p>
</main>

</body>
</html>

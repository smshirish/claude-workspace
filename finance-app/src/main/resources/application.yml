spring:
  application:
    name: finance-app
  config:
    import: optional:file:./app.env[.properties]
  thymeleaf:
    cache: false

server:
  port: ${APP_PORT}

finance:
  storage:
    users-file: ${user.home}/.finance-app/data/users.csv
    accounts-file: ${user.home}/.finance-app/data/accounts.csv
  security:
    default-admin-password: admin123
  anonymisation:
    mapping-file: ${MAPPING_FILE}

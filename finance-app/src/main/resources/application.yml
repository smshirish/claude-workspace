spring:
  application:
    name: finance-app
  config:
    import: optional:file:./app.env[.properties]
  thymeleaf:
    cache: false

server:
  port: ${APP_PORT}

finance:
  storage:
    users-file: ${user.home}/.finance-app/data/users.csv
    accounts-file: ${user.home}/.finance-app/data/accounts.csv
    portfolio-dir: ${user.home}/.finance-app/data/portfolio
  security:
    default-admin-password: ${ADMIN_PASSWORD}
  anonymisation:
    mapping-file: ${MAPPING_FILE}
